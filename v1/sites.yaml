openapi: 3.0.0
info:
  title: Netris API
  version: v1
  license:
    name: MIT
servers:
  - url: localhost:3000
paths:
  /api/sites:
    get:
      tags:
        - Sites
      summary: Request for getting sites.
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOK'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
    post:
      tags:
        - Sites
      summary: Request for adding site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResponseOK'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          example: 1231
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'

  /api/sites/{id}:
    put:
      tags:
        - Sites
      summary: Request for updating site.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The id of a specific site.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResponseOK'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          example: 1231
        '400':
          description: Error
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseError'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            example: 1231
        '404':
          description: Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResponseError'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          example: 1231
                    message: 
                      example: 'Not Found'
                    meta:
                      type: object
                      properties:
                        statusCode:
                          example: 404
    delete:
      tags:
        - Sites
      summary: Request for deleting site.
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the site.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: 
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            example: 1231
                
        '400':
          description: Error
          content:
            application/json:
              schema: 
                allOf:
                  - $ref: '#/components/schemas/ResponseError'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            example: 1231
        '404':
          description: Error
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ResponseError'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          example: 1231
                    message: 
                      example: 'Not Found'
                    meta:
                      type: object
                      properties:
                        statusCode:
                          example: 404
components:
  schemas:
    ResponseOK:
      type: object
      description: Success response
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GetSiteBody'
        errors:
          type: object
          properties:
            key:
              type: string
        message:
          type: string
        isSuccess:
          type: boolean
        meta:
          type: object
          properties:
            apiVersion:
              type: string
              example: 1
            statusCode:
              type: integer
              example: 200
    ResponseError:
      type: object
      description: Error response
      properties:
        data:
          type: array
          items:
            type: object
        errors:
          type: object
          properties:
            key:
              type: string
        message:
          type: string
          example: Error message
        isSuccess:
          type: boolean
          example: false
        meta:
          type: object
          properties:
            apiVersion:
              type: string
              example: 1
            statusCode:
              type: integer
              example: 400
    SiteBody:
      type: object
      required:
        - name
        - nat
        - vpn
        - publicASN
        - physicalInstanceASN
        - virtualInstanceASN
        - rp_id
        - acl_policy
      properties:
        name:
          type: string
          example: name
        publicASN:
          type: number
          example: 324
          description: Site public ASN that should be used for external bgp peer configuration.
        physicalInstanceASN:
          type: number
          example: 324
          description: ASN for ROH (Routing on the Host) compute instances, should be unique within the scope of a site, can be same for different sites.
        virtualInstanceASN:
          type: number
          example: 324
          description: ASN for ROH (Routing on the Host) virtual compute instances, should be unique within the scope of a site, can be same for different sites.
        vpn:
          type: string
          example: disabled
          description: 'Please select site to site VPN mode: Disabled, Hub, Spoke or Dynamic Spoke.'
          enum:
            - disabled
            - hub
            - spoke
            - dspoke
        nat:
          type: string
          example: disabled
          description: ASN for server virtualization hypervisors when using in ROH mode, should be unique within the scope of a site, can be same for different sites.
        rp_id:
          type: number
          example: 1
          description: ROH Routing profile defines set of routing prefixes to be advertised to ROH instances.Default route only - Will advertise 0.0.0.0/0 + loopback address of physically connected switch.Default + Aggregate - Will add prefixes of defined assignments + 'Default' profile.Full - Will advertise all prefixes available in the routing table of the connected switch.
          enum:
            - 1
            - 2
            - 3
        acl_policy:
          type: string
          example: permit
          description: Deny - Layer-3 packet forwarding is denied by default. ACLs are required to permit necessary traffic flows. Deny ACLs will be applied before Permit ACLs.Permit - Layer-3 packet forwarding is allowed by default. ACLs are required to deny unwanted traffic flows. Permit ACLs will be applied before Deny ACLs.
          enum:
            - deny
            - permit
        switchFabric:
          type: string
          example: netris
          deprecated: true
          description: 'DEPRECATED - Switch fabric selection has been removed. Every site is now managed as a Netris-native fabric (`netris`). This field is no longer required and is ignored if provided. It will be removed in a future release.'
          enum:
            - netris
            - equinix_metal
            - dot1q_trunk
        vlanRange:
          type: string
          example: 1-4094
          description: Range of VLAN IDs allowed for use at this site.
        equinixProjectID:
          type: string
          example: ''
          deprecated: true
          description: 'DEPRECATED - Switch fabric providers (Equinix Metal) have been removed. This field is ignored if provided. It will be removed in a future release.'
        equinixProjectAPIKey:
          type: string
          example: ''
          deprecated: true
          description: 'DEPRECATED - Switch fabric providers (Equinix Metal) have been removed. This field is ignored if provided. It will be removed in a future release.'
        equinixLocation:
          type: string
          example: ''
          deprecated: true
          description: 'DEPRECATED - Switch fabric providers (Equinix Metal) have been removed. This field is ignored if provided. It will be removed in a future release.'
          enum:
            - se
            - dc
            - at
            - hk
            - am
            - ny
            - ty
            - sl
            - md
            - sp
            - fr
            - sy
            - ld
            - sg
            - pa
            - tr
            - sv
            - la
            - ch
            - da
    GetSiteBody:
      type: object
      properties:
        id:
          type: integer
          example: 22
          description: Site id.
        name:
          type: string
          example: name
        asn:
          type: integer
          example: 2131231
          description: DEPRECATED (use publicASN) - Site public ASN that should be used for external bgp peer configuration
        publicASN:
          type: number
          example: 324
          description: Site public ASN that should be used for external bgp peer configuration.
        physical_instance_asn:
          type: number
          example: 324
          description: DEPRECATED (use rohASN) - ASN for ROH (Routing on the Host) compute instances, should be unique within the scope of a site, can be same for different sites.
        rohASN:
          type: number
          example: 324
          description: ASN for ROH (Routing on the Host) compute instances, should be unique within the scope of a site, can be same for different sites.
        virtual_instance_asn:
          type: number
          example: 324
          description: DEPRECATED (use vmASN) - ASN for ROH (Routing on the Host) virtual compute instances, should be unique within the scope of a site, can be same for different sites.    
        vmASN:
          type: number
          example: 324
          description: ASN for ROH (Routing on the Host) virtual compute instances, should be unique within the scope of a site, can be same for different sites.
        vpn:
          type: string
          example: disabled
          description: 'Please select site to site VPN mode: Disabled, Hub, Spoke or Dynamic Spoke.'
          enum:
            - disabled
            - hub
            - spoke
            - dspoke
        rp_id:
          type: number
          example: 1
          description: DEPRECATED (use rohProfile) - ROH Routing profile defines set of routing prefixes to be advertised to ROH instances.Default route only - Will advertise 0.0.0.0/0 + loopback address of physically connected switch.Default + Aggregate - Will add prefixes of defined assignments + 'Default' profile.Full - Will advertise all prefixes available in the routing table of the connected switch.
          enum:
            - 1
            - 2
            - 3
        rp_name:
          type: string
          example: Default
          description: DEPRECATED (use rohProfile) - ROH Routing profile defines set of routing prefixes to be advertised to ROH instances.Default route only - Will advertise 0.0.0.0/0 + loopback address of physically connected switch.Default + Aggregate - Will add prefixes of defined assignments + 'Default' profile.Full - Will advertise all prefixes available in the routing table of the connected switch.
          enum:
            - Default
            - Default + Aggregates
            - Full
        rp_tag:
          type: string
          example: default
          description: DEPRECATED (use rohProfile) - ROH Routing profile defines set of routing prefixes to be advertised to ROH instances.Default route only - Will advertise 0.0.0.0/0 + loopback address of physically connected switch.Default + Aggregate - Will add prefixes of defined assignments + 'Default' profile.Full - Will advertise all prefixes available in the routing table of the connected switch.
          enum:
            - default
            - default_agg
            - full_table
        acl_policy:
          type: string
          example: permit
          description: | 
                      - Deny - Layer-3 packet forwarding is denied by default. ACLs are required to permit necessary traffic flows. Deny ACLs will be applied before Permit ACLs.
                      - Permit - Layer-3 packet forwarding is allowed by default. ACLs are required to deny unwanted traffic flows. Permit ACLs will be applied before Deny ACLs.
          enum:
            - deny
            - permit
        switchFabric:
          type: string
          example: netris
          deprecated: true
          description: |
                      DEPRECATED - Switch fabric selection has been removed. Every site is now managed as a Netris-native fabric. Sites created or edited after this change always report `netris`; older sites may still report a legacy value. This field will be removed in a future release.
          enum:
            - netris
            - equinix_metal
            - dot1q_trunk
        vlanRange:
          type: string
          example: 1-4094
          description: Range of VLAN IDs allowed for use at this site.
        equinixProjectID:
          type: string
          example: ''
          deprecated: true
          description: 'DEPRECATED - Switch fabric providers (Equinix Metal) have been removed and this field is no longer returned by the API. It will be removed in a future release.'
        equinixProjectAPIKey:
          type: string
          example: ''
          deprecated: true
          description: 'DEPRECATED - Switch fabric providers (Equinix Metal) have been removed and this field is no longer returned by the API. It will be removed in a future release.'
        equinixLocation:
          type: string
          example: ''
          deprecated: true
          description: 'DEPRECATED - Switch fabric providers (Equinix Metal) have been removed and this field is no longer returned by the API. It will be removed in a future release.'
          enum:
            - se
            - dc
            - at
            - hk
            - am
            - ny
            - ty
            - sl
            - md
            - sp
            - fr
            - sy
            - ld
            - sg
            - pa
            - tr
            - sv
            - la
            - ch
            - da