openapi: 3.0.0
info:
  title: Netris API
  version: v2
paths:
  /api/v2/hw:
    get:
      tags:
        - Inventory
      summary: Request for getting hardware list.
      parameters:
        - name: showLinks
          in: query
          required: false
          schema:
            type: boolean
          description: Include hardware Links information in the response.
          example: false
        - name: showHealth
          in: query
          required: false
          schema:
            type: boolean
          description: Include health status information in the response.
          example: false
        - name: showCustom
          in: query
          required: false
          schema:
            type: boolean
          description: Include custom data in the response.
          example: false
        - name: filterBySites
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter hardware by site IDs. Can be a single site ID or comma-separated list of site IDs.
          example: 1,2,3
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - switch
              - controller
              - softgate
              - server
              - equinix-metal-server
              - phoenixnap-bmc-server
          description: Filter hardware by type.
        - name: filterId
          in: query
          required: false
          schema:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
          description: Filter by hardware ID(s).
        - name: filterName
          in: query
          required: false
          schema:
            type: string
          description: Filter by hardware name. Use quotes for exact match (e.g., "switch1").
        - name: filterDescription
          in: query
          required: false
          schema:
            type: string
          description: Filter by description. Use quotes for exact match.
        - name: filterTenant
          in: query
          required: false
          schema:
            type: string
          description: Filter by tenant name. Use quotes for exact match.
        - name: filterSite
          in: query
          required: false
          schema:
            type: string
          description: Filter by site name. Use quotes for exact match.
        - name: filterType
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by hardware type(s). Use quotes for exact match.
        - name: filterIpaddress
          in: query
          required: false
          schema:
            type: string
          description: Filter by any IP address (main or management). Use quotes for exact match.
        - name: filterMainAddress
          in: query
          required: false
          schema:
            type: string
          description: Filter by main IP address. Use quotes for exact match.
        - name: filterMgmtAddress
          in: query
          required: false
          schema:
            type: string
          description: Filter by management IP address. Use quotes for exact match.
        - name: filterMacAddress
          in: query
          required: false
          schema:
            type: string
          description: Filter by MAC address. Use quotes for exact match.
        - name: filterAsn
          in: query
          required: false
          schema:
            type: string
          description: Filter by BGP ASN. Use quotes for exact match.
        - name: filterNos
          in: query
          required: false
          schema:
            type: string
          description: Filter by Network Operating System name. Use quotes for exact match.
        - name: filterPortCount
          in: query
          required: false
          schema:
            type: string
          description: Filter by port count. Use quotes for exact match.
        - name: filterProfile
          in: query
          required: false
          schema:
            type: string
          description: Filter by inventory profile name. Use quotes for exact match.
        - name: filterStatus
          in: query
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: Filter by health status (ok, warning, critical, unknown).
        - name: filterTags
          in: query
          required: false
          schema:
            type: string
          description: Filter by tags. Use quotes for exact match.
        - name: filterDetails
          in: query
          required: false
          schema:
            type: string
          description: Filter by hardware details (platform, conductor version, uptime, timezone, proxmox version, NOS name). Use quotes for exact match.
        - name: filterUsage
          in: query
          required: false
          schema:
            type: string
          description: Filter by resource usage (routes, MACs, ingress ACLs, rangecut). Use quotes for exact match.
        - name: filterCreatedDate
          in: query
          required: false
          schema:
            type: string
          description: 'Filter by creation date (format: YYYY-MM-DD HH:mm:ss). Use quotes for exact match.'
        - name: filterModifiedDate
          in: query
          required: false
          schema:
            type: string
          description: 'Filter by modification date (format: YYYY-MM-DD HH:mm:ss). Use quotes for exact match.'
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - name
              - description
              - tenant
              - site
              - type
              - ipaddress
              - mainAddress
              - mgmtAddress
              - macAddress
              - asn
              - nos
              - portCount
              - profile
              - createdDate
              - modifiedDate
              - status
              - usage
              - details
          description: Field to sort by (must be used with order parameter).
          example: name
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          description: Sort order - ascending or descending (must be used with sortBy parameter).
          example: asc
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Number of items per page (must be used with page parameter).
          example: 10
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Page number for pagination (must be used with limit parameter).
          example: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hwList'
  /api/v2/hw/{id}:
    get:
      tags:
        - Inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The id of a specific hardware.
      summary: Request for getting hardware by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/hwList'
        "404":
          description: Hardware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/switch:
    post:
      tags:
        - Inventory
      summary: Request for adding hardware type switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/switchAddBody'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1231
                      message:
                        example: Successfully created
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/switch/{id}:
    put:
      tags:
        - Inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The id of a specific hardware.
      summary: Request for updating hardware type switch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/switchEditBody'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1231
                      message:
                        example: Successfully updated
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "404":
          description: Hardware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/server:
    post:
      tags:
        - Inventory
      summary: Request for adding hardware type server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/serverAddBody'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1231
                      message:
                        example: Successfully created
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/server/{id}:
    put:
      tags:
        - Inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The id of a specific hardware.
      summary: Request for updating hardware type server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/serverEditBody'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1231
                      message:
                        example: Successfully updated
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "404":
          description: Hardware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/softgate:
    post:
      tags:
        - Inventory
      summary: Request for adding hardware type softgate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/softgateAddBody'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1231
                      message:
                        example: Successfully created
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/softgate/{id}:
    put:
      tags:
        - Inventory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: The id of a specific hardware.
      summary: Request for updating hardware type softgate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/softgateEditBody'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1231
                      message:
                        example: Successfully updated
        "400":
          description: Bad Request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
        "404":
          description: Hardware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/{type}/{id}:
    delete:
      tags:
        - Inventory
      parameters:
        - in: path
          name: type
          schema:
            type: string
            enum:
              - switch
              - controller
              - softgate
              - server
              - equinix-metal-server
              - phoenixnap-bmc-server
          required: true
          description: Type of the hardware.
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the hardware.
      summary: Request for deleting hardware by id.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: object
                      message:
                        example: Successfully deleted
        "404":
          description: Hardware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/{type}/{name}:
    delete:
      tags:
        - Inventory
      parameters:
        - in: path
          name: type
          schema:
            type: string
            enum:
              - switch
              - controller
              - softgate
              - server
              - equinix-metal-server
              - phoenixnap-bmc-server
          required: true
          description: Type of the hardware.
        - in: path
          name: name
          schema:
            type: string
          required: true
          description: Name of the hardware.
      summary: Request for deleting hardware by name.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ResponseOK'
                  - type: object
                    properties:
                      data:
                        type: object
                      message:
                        example: Successfully deleted
        "404":
          description: Hardware not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/usedips:
    get:
      tags:
        - Inventory
      summary: Get list of used IP addresses in hardware inventory.
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - errors
                  - message
                  - isSuccess
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                  errors:
                    type: object
                    example: {}
                    description: ""
                  message:
                    type: string
                    example: ""
                    description: ""
                  isSuccess:
                    type: boolean
                    example: true
                    description: ""
                  meta:
                    type: object
                    example:
                      apiVersion: v2
                      statusCode: 200
                    description: ""
  /api/v2/hw/profiles:
    get:
      tags:
        - Inventory
      summary: Get list of inventory profiles.
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - errors
                  - message
                  - isSuccess
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                  errors:
                    type: object
                    example: {}
                    description: ""
                  message:
                    type: string
                    example: ""
                    description: ""
                  isSuccess:
                    type: boolean
                    example: true
                    description: ""
                  meta:
                    type: object
                    example:
                      apiVersion: v2
                      statusCode: 200
                    description: ""
  /api/v2/hw/subnets:
    get:
      tags:
        - Inventory
      summary: Get list of available subnets for a specific site.
      parameters:
        - name: siteID
          in: query
          required: true
          schema:
            type: integer
          description: The ID of the site to get subnets for.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - errors
                  - message
                  - isSuccess
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                  errors:
                    type: object
                    example: {}
                    description: ""
                  message:
                    type: string
                    example: ""
                    description: ""
                  isSuccess:
                    type: boolean
                    example: true
                    description: ""
                  meta:
                    type: object
                    example:
                      apiVersion: v2
                      statusCode: 200
                    description: ""
  /api/v2/hw/nos:
    get:
      tags:
        - Inventory
      summary: Get list of available Network Operating Systems (NOS).
      parameters: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - errors
                  - message
                  - isSuccess
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: Cumulus NVUE
                        tag:
                          type: string
                          example: cumulus_nvue
                  errors:
                    type: object
                    example: {}
                    description: ""
                  message:
                    type: string
                    example: ""
                    description: ""
                  isSuccess:
                    type: boolean
                    example: true
                    description: ""
                  meta:
                    type: object
                    example:
                      apiVersion: v2
                      statusCode: 200
                    description: ""
  /api/v2/hw/{id}/curl:
    get:
      tags:
        - Inventory
      summary: Get curl installation command for a hardware unit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Hardware unit ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - errors
                  - message
                  - isSuccess
                  - meta
                properties:
                  data:
                    type: string
                    example: curl -fksSL https://get.netris.io | sh -s -- --lo 100.64.77.4 --controller 10.0.0.1 --ctl-version 4.0.0 --hostname switch1.netris.io --auth abc123 --node-type switch --hw-nos cumulus_nvue
                    description: Curl command to install and configure the Netris agent on the hardware unit
                  errors:
                    type: object
                    example: {}
                    description: ""
                  message:
                    type: string
                    example: ""
                    description: ""
                  isSuccess:
                    type: boolean
                    example: true
                    description: ""
                  meta:
                    type: object
                    example:
                      apiVersion: v2
                      statusCode: 200
                    description: ""
        "400":
          description: Bad Request - Invalid hardware ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
  /api/v2/hw/ports:
    get:
      tags:
        - Inventory
      summary: Returns a list of network interfaces for Hardware.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - used
              - free
          description: Filter by port type. Use 'used' to get used ports or 'free' to get free ports.
        - name: site
          in: query
          schema:
            type: integer
          description: Filter by site ID.
        - name: tenant
          in: query
          schema:
            type: integer
          description: Filter by tenant ID.
        - name: switchID
          in: query
          schema:
            type: integer
          description: Filter by switch ID.
        - name: search
          in: query
          schema:
            type: string
          description: Search term.
        - name: ids
          in: query
          schema:
            oneOf:
              - type: array
                items:
                  type: integer
              - type: string
                description: Comma-separated list of IDs.
          description: Filter by specific IDs. Accepts an array or a comma-separated string of integers.
        - name: limit
          in: query
          schema:
            type: integer
          description: Maximum number of results to return.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Number of results to skip for pagination. Defaults to 0.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseOK'
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseError'
components:
  schemas:
    asnString:
      type: string
      enum:
        - auto
      example: auto
    asnNumber:
      type: number
      minimum: 4200000000
      maximum: 4209999999
      example: 4200000001
    hwList:
      type: object
      required:
        - data
        - errors
        - message
        - isSuccess
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/hwItem'
        errors:
          type: object
          example: {}
          description: ""
        message:
          type: string
          example: ""
          description: ""
        isSuccess:
          type: boolean
          example: true
          description: ""
        meta:
          type: object
          example:
            apiVersion: v2
            statusCode: 200
          description: ""
    hwItem:
      type: object
      description: ""
      properties:
        id:
          type: number
          example: 1
          description: Unique identifier for the hardware
        name:
          type: string
          example: switch1.netris.io
          description: Hostname of the hardware unit
        description:
          type: string
          example: Santa-Clara Spine Switch
          description: Human-readable description of the hardware
        type:
          type: string
          enum:
            - switch
            - controller
            - softgate
            - server
            - equinix-metal-server
            - phoenixnap-bmc-server
          example: switch
          description: Type of the hardware device
        status:
          type: string
          enum:
            - ok
            - offline
            - error
            - maintenance
          example: ok
          description: Current operational status of the hardware
        nos:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: Cumulus NVUE
            tag:
              type: string
              example: cumulus_nvue
              enum:
                - arista_eos
                - cumulus_nvue
                - dell_sonic
                - ec_sonic
          description: Network Operating System information (applicable to switches)
        mainAddress:
          type: string
          example: 100.64.77.4
          description: Primary IP address (loopback) of the hardware unit
        mgmtAddress:
          type: string
          example: 10.10.20.4
          description: Out-of-band management IP address
        macAddress:
          type: string
          example: 23:00:2F:BE:54:87
          description: MAC address used for zero-touch provisioning
        portCount:
          type: number
          example: 16
          description: Number of physical ports on the device
        asn:
          type: string
          example: auto
          description: BGP Autonomous System Number
        tenant:
          type: object
          properties:
            id:
              type: number
              example: 12
            name:
              type: string
              example: UNIX
          description: Tenant that owns this hardware unit
        site:
          type: object
          properties:
            id:
              type: number
              example: 22
            name:
              type: string
              example: Santa-Clara
          description: Physical site location of the hardware
        profile:
          type: object
          nullable: true
          properties:
            id:
              type: number
              example: 1
            name:
              type: string
              example: my_profile
          description: Inventory profile containing global configuration (NTP, DNS, timezone, etc.)
        links:
          type: array
          items:
            $ref: '#/components/schemas/linksBody'
          description: Physical connections between hardware units
        sgFlavor:
          description: Specifies the flavor of the softgate object. This field is applicable only to objects of type 'softgate'.
          nullable: true
          type: string
          enum:
            - sg-pro
            - sg-hs
          example: null
        sgRole:
          description: Specifies the role of the softgate object. This field is applicable only to objects of type 'softgate' with sgFlavor 'sg-hs'.
          nullable: true
          type: string
          enum:
            - general
            - snat
          example: null
        swRole:
          description: The switch's role in the fabric hierarchy
          nullable: true
          type: string
          enum:
            - generic
            - leaf
            - spine
            - super-spine
          example: spine
        srvRole:
          description: |
            Use the 'generic' role if no Netris agent is running on the server. If the Netris integration agent is required on the server, select the appropriate platform type as the role.
          nullable: true
          type: string
          enum:
            - generic
            - hyperv_cs
            - evpn_vtep
          example: null
        tags:
          type: array
          items:
            type: string
          example:
            - tag1
            - tag2
          description: User-defined tags for categorization and filtering
        dpus:
          type: array
          items:
            $ref: '#/components/schemas/dpuBody'
